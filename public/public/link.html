<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecta Gestão Integrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12213B;
    --ink-2: #182A48;
    --paper: #F3EEE1;
    --paper-dim: #C9C2AC;
    --rule: rgba(243,238,225,0.14);
    --gold: #CDA043;
    --gold-dim: #A9803A;
    --sage: #8FA396;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
  }

  main{
    width:100%;
    max-width:420px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }

  .mark{
    width:44px;
    height:44px;
    margin:0 auto 22px;
    border:1px solid var(--gold-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    color:var(--gold);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }

  h1 span{
    display:block;
    font-size:16px;
    font-weight:500;
    color:var(--paper-dim);
    margin-top:6px;
    font-family:'IBM Plex Sans', sans-serif;
  }

  .tagline{
    margin:16px auto 0;
    max-width:280px;
    font-size:14px;
    line-height:1.55;
    color:var(--paper-dim);
  }

  .primary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    background:var(--gold);
    color:var(--ink);
    text-decoration:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:15px;
    border:none;
    opacity:0;
    animation:rise 0.5s ease forwards;
    animation-delay:0.05s;
  }

  .primary:hover, .primary:focus-visible{
    background:#DDB05B;
  }

  .primary svg{ width:17px; height:17px; flex-shrink:0; }

  .ledger{
    margin-top:6px;
    border-top:1px solid var(--rule);
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 4px;
    border-bottom:1px solid var(--rule);
    text-decoration:none;
    color:var(--paper);
    opacity:0;
    animation:rise 0.5s ease forwards;
  }

  .row:nth-of-type(1){ animation-delay:0.11s; }
  .row:nth-of-type(2){ animation-delay:0.17s; }
  .row:nth-of-type(3){ animation-delay:0.23s; }
  .row:nth-of-type(4){ animation-delay:0.29s; }

  .row .label{
    font-size:15px;
    font-weight:500;
  }

  .row .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--sage);
    white-space:nowrap;
  }

  .row:hover .label, .row:focus-visible .label{
    color:var(--gold);
  }

  footer{
    margin-top:44px;
    text-align:center;
    font-size:12px;
    color:var(--paper-dim);
    opacity:0.7;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .primary, .row{ animation:none; opacity:1; }
  }

  a:focus-visible, button:focus-visible{
    outline:1px solid var(--gold);
    outline-offset:3px;
  }
</style>
</head>
<body>
<main>

  <header>
    <div class="mark">C</div>
    <h1>Connecta<span>Gestão Integrada</span></h1>
    <p class="tagline">BPO financeiro, recrutamento &amp; seleção e eSocial doméstico.</p>
  </header>

  <a class="primary" href="https://wa.me/5519999264317" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.15c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.56-1.17-2.98 0-1.42.75-2.11 1.01-2.4.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.81 2 .88 2.14.07.15.12.32.02.51-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.13.55.15.28.68 1.13 1.47 1.83 1.01.9 1.86 1.19 2.13 1.32.28.13.44.11.6-.07.17-.18.71-.83.9-1.11.19-.28.38-.23.63-.14.26.09 1.65.78 1.93.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
    Falar no WhatsApp
  </a>

  <div class="ledger">
    <a class="row" href="https://connecta-gestao.vercel.app/precos.html" target="_blank" rel="noopener">
      <span class="label">Planos e preços</span>
      <span class="tag">SITE</span>
    </a>
    <a class="row" href="https://connecta-gestao.vercel.app/vagas.html" target="_blank" rel="noopener">
      <span class="label">Vagas abertas</span>
      <span class="tag">SITE</span>
    </a>
    <a class="row" href="https://instagram.com/connectagestaointegrada" target="_blank" rel="noopener">
      <span class="label">Instagram</span>
      <span class="tag">@connectagestaointegrada</span>
    </a>
    <a class="row" href="mailto:Connectagestaointegrada@gmail.com">
      <span class="label">E-mail</span>
      <span class="tag">CONTATO</span>
    </a>
  </div>

  <footer>Connecta Gestão Integrada</footer>

</main>
</body>
</html>
